<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
     <div class="calculator">
        
        <div class="display">
          <div id="show"></div>
        </div>

    <div class="buttons">

    <div class="firstRow">
      <div id="AC">AC</div>
      <div id="percentage">%</div>
      <div id="del">del</div>
      <div id="div">/</div>
    </div>

    <div class="secondRow">
        <div id="seven">7</div>
        <div id="eight">8</div>
        <div id="nine">9</div>
        <div id="multiply">x</div>
    </div>

    <div class="thirdRow">
        <div id="four">4</div>
        <div id="five">5</div>
        <div id="six">6</div>
        <div id="subtraction">-</div>
    </div>

    <div class="fourthRow">
        <div id="one">1</div>
        <div id="two">2</div>
        <div id="three">3</div>
        <div id="plus">+</div>
    </div>

    <div class="fifthRow">
        <div id="doubleZero">00</div>
        <div id="zero">0</div>
        <div id="dot">.</div>
        <div id="equal">=</div>
    </div>

    </div>
    </div>
    <script src="script.js"></script>
    </body>
</html>
